<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./Assate/image/image_1-removebg-preview.png">

<style>
  body {
    margin: 0;
    height: 100vh;      
    display: flex;
    justify-content: center; 
    align-items: center;     
  }

  .box {
    border: 5px solid red;
    padding: 20px;
    width: 200px;

<body style="text-align: center;">
    <main class="form4">
        <form action="#" method="post">
            <fieldset style="width: 250px; height: 250px; background-color: transparent; border-color: black;">
                <h1>Sign Up</h1>
                <br>
                <label for="Notifications">Receive Notifications</label>
                <input type="checkbox" id="Notifications" name="Notifications">
                <br><br>
                <select name="Location" id="Location">
                    <label for="Location">Preferred Job Location</label>
                <option value="">Preferred Job Location</option>
                <option value="">Hyderabad</option>
                <option value="">Peshawar</option>
                <option value="">Karachi</option>
                <option value="">Punjab</option>
                <option value="">Lahore</option>
                <option value="">Islamabad</option>
            </select>
                <br><br>
                <input type="submit">
                <br><br>
                <p>Go to the <a href="./index.html">Home Page</a></p>
            </fieldset>
        </form>
    </main>

</html>
