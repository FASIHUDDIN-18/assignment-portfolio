<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="icon" href="./Assate/image/image_1-removebg-preview.png">
</head>
<style>
  body {
    margin: 0;
    height: 100vh;      
    display: flex;
    justify-content: center; 
    align-items: center;     
  }

  .box {
    border: 5px solid red;
    padding: 20px;
    width: 200px;
  }
</style>    
<body style="text-align: center;">
    <main class="form2">
        <form action="#" method="post">
            <fieldset style=" width: 250px; height: 400px; background-color: transparent; border-color: black;">
                <h1>Sign Up</h1>
                <br>
                <input type="number" id="tel" name="tel" placeholder="Phone Number" required>
                <br><br>
                <input type="text" id="Country" name="Country" placeholder="Country" required>
                <br><br>
                <input type="textarea" id="Address" name="Address" placeholder="Address" required>
                <br><br>
                <input type="Select dropdown" id="Method" name="Method" placeholder="Preferred Contact Method" required>
                <br><br>
                <label for="Terms">Agreement to Terms</label>
                <input type="Checkbox" id="Terms" name="Terms">
                <br><br>
                <button><a href="./form3.html" style="font-size: xx-large;">Next</a></button>
            </fieldset>
        </form>
    </main>
</body>
</html>
