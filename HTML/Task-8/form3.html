<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="icon" href="./Assate/image/image_1-removebg-preview.png">
</head>
<style>
  body {
    margin: 0;
    height: 100vh;      
    display: flex;
    justify-content: center; 
    align-items: center;     
  }

  .box {
    border: 5px solid red;
    padding: 20px;
    width: 200px;
  }
</style>    
<body style="text-align: center;">
    <main class="form2">
        <form action="#" method="post">
            <fieldset style="width: 250px; height: 400px; background-color: transparent; border-color: black;">
                <h1>Sign Up</h1>
                <br>
                <input type="text" id="job" name="job" placeholder="Current Job Title" required>
                <br><br>
                <input type="Number" id="Experience" name="Experience" placeholder="Years of Experience" required>
                <br><br>
                <input type="Month" id="Employment" name="Employment" placeholder="Employment Start Date" required>
                <br><br>
                <input type="file" id="Resume" name="Resume" placeholder="Upload Resume" required>
                <br><br>
                <input type="multiple skills" id="Skills" name="Skills" placeholder="Skills" required>
                <br><br>
                <button><a href="./form4.html" style="font-size: xx-large;">Next</a></button>
            </fieldset>
        </form>
    </main>
</body>
</html>
